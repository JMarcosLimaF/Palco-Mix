<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Palco Mix · Calçados e Acessórios</title>
    <meta
      name="description"
      content="Palco Mix Calçados e Acessórios — chinelos, rasteirinhas, tamancos, sandálias e tênis das marcas que você ama. Peça pelo WhatsApp."
    />
    <!-- cor do tema claro (padrão); o script abaixo e o applyTheme trocam para #0A0A0B no escuro -->
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon.png" />
    <!--
      Open Graph (prévia no WhatsApp/Instagram/Facebook): os scrapers exigem URL absoluta.
      VITE_SITE_URL vem do .env (domínio publicado, sem barra final) e é substituído no build.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Palco Mix" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Palco Mix · Calçados e Acessórios" />
    <meta
      property="og:description"
      content="Catálogo digital Palco Mix: chinelos, rasteirinhas, tamancos, sandálias e tênis. Peça pelo WhatsApp."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/brand/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo da Palco Mix Calçados e Acessórios" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema (classe .dark e cor da barra do navegador) antes da primeira pintura.
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('palcomix:theme') || 'null')
          var mode = (stored && stored.state && stored.state.mode) || 'light'
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#0A0A0B')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
